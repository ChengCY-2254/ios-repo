name: Build & Deploy Repo

on:
  push:
    branches: [main]
    paths:
      - 'debs/**'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      REPO_ORIGIN: ${{ vars.REPO_ORIGIN }}
      REPO_LABEL: ${{ vars.REPO_LABEL }}
      REPO_DESCRIPTION: ${{ vars.REPO_DESCRIPTION }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dpkg-scanpackages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev
          sudo apt-get clean

      - name: Generate Packages
        run: |
          rm -f Packages Packages.gz Packages.bz2 Packages.xz Release
          if [ "$(find debs -name '*.deb' 2>/dev/null | wc -l)" -gt 0 ]; then
            dpkg-scanpackages --multiversion debs /dev/null > Packages
          else
            : > Packages
          fi

      - name: Compress Packages
        run: |
          gzip -9c Packages > Packages.gz
          bzip2 -9c Packages > Packages.bz2
          xz -9c Packages > Packages.xz

      - name: Generate Release
        run: python3 scripts/gen-release.py --root .

      - name: Validate
        run: |
          test -f Packages
          test -s Release

      - name: Commit metadata
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update repo metadata [skip ci]'
          file_pattern: 'Packages* Release'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: '41898282+github-actions[bot]@users.noreply.github.com'