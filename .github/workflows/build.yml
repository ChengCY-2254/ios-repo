name: Build & Deploy Cydia/Sileo Repo

# 触发方式：
#  向 main 推送 .deb
on:
  push:
    branches: [ main ]
    paths:
      - 'debs/**'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      # 显式从 GitHub Actions 变量存储（vars 上下文）读取，绕开环境注入层
      REPO_ORIGIN: ${{ vars.REPO_ORIGIN }}
      REPO_LABEL: ${{ vars.REPO_LABEL }}
      REPO_DESCRIPTION: ${{ vars.REPO_DESCRIPTION }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 dpkg-scanpackages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev
          sudo apt-get clean

      - name: 生成 Packages
        run: |
          rm -f Packages Packages.gz Packages.bz2 Packages.xz Release
          if [ "$(find debs -name '*.deb' 2>/dev/null | wc -l)" -gt 0 ]; then
            dpkg-scanpackages --multiversion debs /dev/null > Packages
          else
            echo "debs/ 下没有 .deb 文件，生成空 Packages"
            : > Packages
          fi

      - name: 压缩 Packages
        run: |
          gzip -9c Packages > Packages.gz
          bzip2 -9c Packages > Packages.bz2
          xz -9c Packages > Packages.xz

      - name: ▶ 调试：env 注入 vs vars 上下文（临时，定位后可删）
        run: |
          echo "env注入: REPO_ORIGIN=[$REPO_ORIGIN]"
          echo "vars上下文: REPO_ORIGIN=${{ vars.REPO_ORIGIN }}"

      - name: 生成 Release
        run: python3 scripts/gen-release.py --root .

      - name: 校验元数据
        run: |
          test -f Packages
          test -s Release

      - name: 提交生成的元数据
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: 自动更新软件源元数据 [skip ci]'
          file_pattern: 'Packages* Release'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: '41898282+github-actions[bot]@users.noreply.github.com'